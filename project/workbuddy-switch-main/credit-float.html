<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>积分概览</title>
    <!-- 空 favicon：避免每次打开都去请求不存在的 /favicon.ico（控制台报 404）。 -->
    <link rel="icon" href="data:," />
    <!--
      积分悬浮窗的独立页面入口。

      为什么单独一份 HTML，而不是和主窗口共用 index.html 靠窗口 label 分流：
      主窗口与悬浮窗是两个 webview，但共用同一个文档时，「渲染哪一个 React 树」
      完全押在运行期的 label 判定上——判定一旦不成立（宿主差异、脚本顺序、资源
      回退……），悬浮窗就会渲染出整个主界面：既没有环形图，也没有拖拽区，
      看起来就是「点了按钮弹出一个不知道是什么的东西」。独立入口把这个不确定性
      从运行期挪到构建期：credit-float.html 只会挂载 CreditFloatPage。

      窗口本身仍是无边框 + 透明的原生窗口（见 src-tauri/src/credit_float.rs），
      因此这里必须保证文档底色透明、无外边距、无滚动条，只让卡片可见。
    -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
    </style>
    <script type="module" src="/src/credit-float.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
